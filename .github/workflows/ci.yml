name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true
    - run: make
    - uses: actions/upload-artifact@v4
      with:
        name: site
        path: site
